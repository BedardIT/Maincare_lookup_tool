<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MaineCare Provider Enrollment Lookup</title>
<style>
  :root {
    --brand:#0b5cab; --brand-dark:#08427c; --ok:#1a7f37; --bad:#b42318;
    --ink:#1c2433; --muted:#5b667a; --line:#e3e8f0; --bg:#f5f7fb; --card:#fff;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:"Segoe UI",system-ui,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45;
  }
  header {
    background:linear-gradient(135deg,var(--brand),var(--brand-dark));
    color:#fff; padding:22px 20px;
  }
  header h1 { margin:0; font-size:1.4rem; }
  header p { margin:4px 0 0; opacity:.9; font-size:.9rem; }
  .wrap { max-width:1000px; margin:0 auto; padding:20px; }

  /* ---- Controls ---- */
  .controls { background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(16,24,40,.05); }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
  .field { display:flex; flex-direction:column; gap:4px; flex:1 1 200px; }
  .field label { font-size:.78rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; }
  input, select {
    padding:9px 11px; border:1px solid var(--line); border-radius:8px;
    font-size:.95rem; background:#fff; color:var(--ink);
  }
  input:focus, select:focus { outline:2px solid var(--brand); outline-offset:1px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button {
    border:none; background:#fff; padding:9px 14px; cursor:pointer; font-size:.9rem;
    color:var(--muted); font-weight:600;
  }
  .seg button.active { background:var(--brand); color:#fff; }
  .btn {
    background:var(--brand); color:#fff; border:none; border-radius:8px;
    padding:10px 18px; font-size:.95rem; font-weight:600; cursor:pointer;
  }
  .btn:hover { background:var(--brand-dark); }
  .btn.ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  .advanced { margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);
    display:none; }
  .advanced.open { display:block; }
  .toggle-adv { background:none; border:none; color:var(--brand); cursor:pointer;
    font-size:.85rem; font-weight:600; margin-top:8px; padding:0; }

  /* ---- Results ---- */
  .meta { margin:18px 4px 8px; font-size:.9rem; color:var(--muted); }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(16,24,40,.05);
    cursor:pointer; transition:box-shadow .15s;
  }
  .card:hover { box-shadow:0 4px 14px rgba(16,24,40,.10); }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .card h3 { margin:0 0 2px; font-size:1.08rem; }
  .type-tag {
    font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    padding:2px 8px; border-radius:20px;
  }
  .type-org { background:#eef4ff; color:var(--brand-dark); }
  .type-prac { background:#f3edff; color:#5b21b6; }
  .badge {
    display:inline-flex; align-items:center; gap:5px; font-size:.8rem; font-weight:700;
    padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .badge.ok { background:#e7f6ec; color:var(--ok); }
  .badge.bad { background:#fdeceb; color:var(--bad); }
  .kv { display:flex; flex-wrap:wrap; gap:6px 22px; margin-top:8px; font-size:.9rem; }
  .kv span b { color:var(--muted); font-weight:600; }
  .copy { border:none; background:#eef2f7; border-radius:6px; cursor:pointer;
    font-size:.72rem; padding:2px 6px; margin-left:6px; color:var(--brand); }
  .copy:hover { background:#dde5ef; }

  /* ---- States ---- */
  .state { text-align:center; padding:40px 20px; color:var(--muted); }
  .spinner { width:34px; height:34px; border:3px solid var(--line);
    border-top-color:var(--brand); border-radius:50%; margin:0 auto 12px;
    animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .error { background:#fdeceb; color:var(--bad); border:1px solid #f5c6c2;
    border-radius:10px; padding:14px; }

  /* ---- Flyout ---- */
  .overlay { position:fixed; inset:0; background:rgba(16,24,40,.45);
    display:none; z-index:50; }
  .overlay.open { display:block; }
  .flyout {
    position:fixed; top:0; right:0; height:100%; width:min(480px,100%);
    background:#fff; z-index:60; transform:translateX(100%);
    transition:transform .25s ease; overflow-y:auto; box-shadow:-4px 0 24px rgba(16,24,40,.2);
  }
  .flyout.open { transform:translateX(0); }
  .flyout-head { position:sticky; top:0; background:var(--brand); color:#fff;
    padding:16px 20px; display:flex; justify-content:space-between; align-items:center; }
  .flyout-head h2 { margin:0; font-size:1.1rem; }
  .flyout-close { background:none; border:none; color:#fff; font-size:1.5rem;
    cursor:pointer; line-height:1; }
  .flyout-body { padding:20px; }
  .detail-row { padding:10px 0; border-bottom:1px solid var(--line); }
  .detail-row b { display:block; font-size:.75rem; text-transform:uppercase;
    color:var(--muted); letter-spacing:.03em; margin-bottom:2px; }
  .print-btn { margin-top:16px; width:100%; }

  @media print {
    header,.controls,.meta,.flyout-close,.overlay { display:none !important; }
    .flyout { position:static; transform:none; width:100%; box-shadow:none; }
  }
</style>
</head>
<body>
<header>
  <h1>🩺 MaineCare Provider Enrollment Lookup</h1>
  <p>Verify that a referring provider or facility is enrolled with Maine Medicaid before billing.</p>
</header>

<div class="wrap">
  <div class="controls">
    <div class="row">
      <div class="field" style="flex:0 0 auto;">
        <label>Search for</label>
        <div class="seg" id="typeSeg">
          <button data-type="both" class="active">Both</button>
          <button data-type="Practitioner">Providers</button>
          <button data-type="Organization">Organizations</button>
        </div>
      </div>
      <div class="field">
        <label id="qLabel">Name or NPI</label>
        <input id="q" type="text" placeholder="e.g. Smith  ·  Bedard Pharmacy  ·  1234567890" autocomplete="off" />
      </div>
      <button class="btn" id="searchBtn">Search</button>
    </div>

    <button class="toggle-adv" id="advToggle">▾ Advanced filters</button>
    <div class="advanced" id="advanced">
      <div class="row">
        <div class="field">
          <label>City</label>
          <input id="fCity" type="text" placeholder="e.g. Auburn" />
        </div>
        <div class="field">
          <label>State</label>
          <input id="fState" type="text" maxlength="2" placeholder="ME" />
        </div>
        <div class="field">
          <label>Specialty / Taxonomy</label>
          <input id="fSpecialty" type="text" placeholder="e.g. Pharmacy, Cardiology" />
        </div>
        <div class="field" style="flex:0 0 160px;">
          <label>Status</label>
          <select id="fActive">
            <option value="">Any</option>
            <option value="true">Active only</option>
            <option value="false">Inactive only</option>
          </select>
        </div>
        <div class="field" style="flex:0 0 140px;">
          <label>Results / page</label>
          <select id="fCount">
            <option>25</option>
            <option selected>50</option>
            <option>100</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="meta" id="meta"></div>
  <div id="results"></div>
  <div id="pager" style="text-align:center; margin:12px 0;"></div>
</div>

<!-- Detail flyout -->
<div class="overlay" id="overlay"></div>
<aside class="flyout" id="flyout" aria-hidden="true">
  <div class="flyout-head">
    <h2 id="flyoutTitle">Details</h2>
    <button class="flyout-close" id="flyoutClose" aria-label="Close">&times;</button>
  </div>
  <div class="flyout-body" id="flyoutBody"></div>
</aside>

<script>
/* ============================================================
   CONFIG — set this to your Cloudflare Worker proxy base URL.
   The Worker should forward to:
   https://maineproviderdirectory.verityanalytics.org/fhir
   ============================================================ */
const PROXY_BASE = "https://YOUR-WORKER.workers.dev/fhir"; // <-- CHANGE ME
// If you ever hit the FHIR server directly (CORS permitting), use:
// const PROXY_BASE = "https://maineproviderdirectory.verityanalytics.org/fhir";

let currentType = "both";
let nextUrls = {};      // { Practitioner: url, Organization: url } for "Load more"
const cache = {};       // sessionStorage-backed query cache

/* ---------- Element refs ---------- */
const el = id => document.getElementById(id);
const results = el("results"), meta = el("meta"), pager = el("pager");

/* ---------- Segmented type control ---------- */
el("typeSeg").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  [...el("typeSeg").children].forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  currentType = e.target.dataset.type;
  el("qLabel").textContent = currentType === "Organization"
    ? "Organization name or NPI"
    : currentType === "Practitioner" ? "Provider name or NPI" : "Name or NPI";
});

el("advToggle").addEventListener("click", () => {
  const a = el("advanced");
  a.classList.toggle("open");
  el("advToggle").textContent = (a.classList.contains("open") ? "▴" : "▾") + " Advanced filters";
});

/* ---------- Debounced live search ---------- */
let timer;
el("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(runSearch, 350); });
el("q").addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(timer); runSearch(); } });
el("searchBtn").addEventListener("click", () => { clearTimeout(timer); runSearch(); });
["fCity","fState","fSpecialty","fActive","fCount"].forEach(id =>
  el(id).addEventListener("change", runSearch));

/* ---------- Build a FHIR query for one resource type ---------- */
function buildUrl(resource, term) {
  const p = new URLSearchParams();
  const count = el("fCount").value || "50";
  p.set("_count", count);

  const isNPI = /^\d{10}$/.test(term.trim());
  if (term.trim()) {
    if (isNPI) p.set("identifier", term.trim());        // NPI search
    else p.set("name", term.trim());                    // name search
  }
  const city = el("fCity").value.trim();
  const state = el("fState").value.trim();
  const spec = el("fSpecialty").value.trim();
  const active = el("fActive").value;

  if (city)  p.set("address-city", city);
  if (state) p.set("address-state", state);
  if (active) p.set("active", active);
  // taxonomy/specialty differs by resource
  if (spec) {
    if (resource === "Practitioner") p.set("qualification", spec);
    else p.set("type", spec);
  }
  return `${PROXY_BASE}/${resource}?${p.toString()}`;
}

/* ---------- Main search ---------- */
async function runSearch() {
  const term = el("q").value;
  const hasFilters = el("fCity").value || el("fState").value || el("fSpecialty").value || el("fActive").value;
  if (!term.trim() && !hasFilters) { results.innerHTML=""; meta.textContent=""; pager.innerHTML=""; return; }

  const types = currentType === "both" ? ["Practitioner","Organization"] : [currentType];
  results.innerHTML = `<div class="state"><div class="spinner"></div>Searching Maine provider directory…</div>`;
  meta.textContent = ""; pager.innerHTML = ""; nextUrls = {};

  try {
    const all = [];
    for (const t of types) {
      const url = buildUrl(t, term);
      const bundle = await fetchFHIR(url);
      const entries = (bundle.entry || []).map(e => ({ ...e.resource, __type:t }));
      all.push(...entries);
      const next = (bundle.link || []).find(l => l.relation === "next");
      if (next) nextUrls[t] = next.url;
    }
    render(all, false);
  } catch (err) {
    results.innerHTML = `<div class="error"><b>Lookup failed.</b><br>${escapeHtml(err.message)}<br>
      <button class="btn ghost" style="margin-top:10px" onclick="runSearch()">Retry</button></div>`;
  }
}

/* ---------- Load more (pagination) ---------- */
async function loadMore() {
  pager.innerHTML = `<div class="spinner"></div>`;
  try {
    const more = [];
    const newNext = {};
    for (const t of Object.keys(nextUrls)) {
      const proxied = nextUrls[t].replace(/^https?:\/\/[^/]+\/fhir/, PROXY_BASE);
      const bundle = await fetchFHIR(proxied);
      more.push(...(bundle.entry||[]).map(e => ({ ...e.resource, __type:t })));
      const next = (bundle.link||[]).find(l => l.relation==="next");
      if (next) newNext[t] = next.url;
    }
    nextUrls = newNext;
    render(more, true);
  } catch(err){ pager.innerHTML = `<div class="error">Couldn't load more: ${escapeHtml(err.message)}</div>`; }
}

/* ---------- Fetch w/ sessionStorage cache ---------- */
async function fetchFHIR(url) {
  if (cache[url]) return cache[url];
  const cached = sessionStorage.getItem(url);
  if (cached) { cache[url] = JSON.parse(cached); return cache[url]; }
  const res = await fetch(url, { headers:{ "Accept":"application/fhir+json" } });
  if (!res.ok) throw new Error(`Server returned ${res.status} ${res.statusText}`);
  const data = await res.json();
  cache[url] = data;
  try { sessionStorage.setItem(url, JSON.stringify(data)); } catch(_){}
  return data;
}

/* ---------- Render cards ---------- */
let store = [];
function render(items, append) {
  if (!append) store = [];
  store.push(...items);

  if (store.length === 0) {
    results.innerHTML = `<div class="state">No matching providers or organizations found.<br>
      <small>Try a partial name, remove filters, or switch the search type.</small></div>`;
    return;
  }
  const html = store.map((r, i) => card(r, i)).join("");
  results.innerHTML = html;
  meta.textContent = `Showing ${store.length} result${store.length!==1?"s":""}` +
    (Object.keys(nextUrls).length ? " (more available)" : "");
  pager.innerHTML = Object.keys(nextUrls).length
    ? `<button class="btn ghost" onclick="loadMore()">Load more results</button>` : "";
}

function card(r, i) {
  const isOrg = r.__type === "Organization";
  const name = displayName(r);
  const npi = getNPI(r);
  const active = r.active !== false;
  const addr = formatAddress(r.address && r.address[0]);
  return `<div class="card" onclick="openDetail(${i})">
    <div class="card-top">
      <div>
        <span class="type-tag ${isOrg?'type-org':'type-prac'}">${isOrg?'Organization':'Provider'}</span>
        <h3>${escapeHtml(name)}</h3>
      </div>
      <span class="badge ${active?'ok':'bad'}">${active?'✅ Enrolled / Active':'❌ Inactive'}</span>
    </div>
    <div class="kv">
      <span><b>NPI:</b> ${npi?escapeHtml(npi):'—'} ${npi?copyBtn(npi):''}</span>
      ${addr?`<span><b>Location:</b> ${escapeHtml(addr)}</span>`:''}
      ${specialty(r)?`<span><b>Specialty:</b> ${escapeHtml(specialty(r))}</span>`:''}
    </div>
  </div>`;
}

/* ---------- Detail flyout ---------- */
function openDetail(i) {
  const r = store[i];
  const isOrg = r.__type === "Organization";
  el("flyoutTitle").textContent = displayName(r);
  const rows = [];
  const add = (label,val)=> val && rows.push(`<div class="detail-row"><b>${label}</b>${escapeHtml(val)} ${label==='NPI'?copyBtn(val):''}</div>`);

  add("Type", isOrg ? "Organization / Facility" : "Individual Provider");
  add("NPI", getNPI(r));
  rows.push(`<div class="detail-row"><b>Enrollment Status</b>
    <span class="badge ${r.active!==false?'ok':'bad'}">${r.active!==false?'✅ Active / Enrolled':'❌ Inactive'}</span></div>`);
  add("Specialty / Taxonomy", specialty(r));
  add("Address", formatAddress(r.address && r.address[0]));
  add("Phone", getContact(r,"phone"));
  add("Email", getContact(r,"email"));
  if (isOrg && r.partOf) add("Part of", r.partOf.display);
  if (!isOrg && r.qualification) {
    r.qualification.forEach(q => add("Qualification", q.code && q.code.text));
  }
  add("FHIR ID", r.id);

  el("flyoutBody").innerHTML = rows.join("") +
    `<button class="btn print-btn" onclick="window.print()">🖨️ Print this record</button>`;
  el("overlay").classList.add("open");
  el("flyout").classList.add("open");
  el("flyout").setAttribute("aria-hidden","false");
}
function closeDetail(){ el("overlay").classList.remove("open");
  el("flyout").classList.remove("open"); el("flyout").setAttribute("aria-hidden","true"); }
el("flyoutClose").addEventListener("click", closeDetail);
el("overlay").addEventListener("click", closeDetail);
document.addEventListener("keydown", e => { if(e.key==="Escape") closeDetail(); });

/* ---------- FHIR helpers ---------- */
function displayName(r){
  if (r.__type === "Organization") return r.name || "(Unnamed organization)";
  const n = r.name && r.name[0];
  if (!n) return "(Unnamed provider)";
  if (n.text) return n.text;
  return [ (n.prefix||[]).join(" "), (n.given||[]).join(" "), n.family, (n.suffix||[]).join(" ") ]
    .filter(Boolean).join(" ");
}
function getNPI(r){
  const id = (r.identifier||[]).find(x =>
    (x.system||"").includes("us-npi") || (x.type && x.type.text==="NPI") || /npi/i.test(x.system||""));
  return id ? id.value : ((r.identifier||[])[0]||{}).value;
}
function formatAddress(a){
  if(!a) return "";
  if(a.text) return a.text;
  return [ (a.line||[]).join(" "), a.city, a.state, a.postalCode ].filter(Boolean).join(", ");
}
function getContact(r,sys){
  const c = (r.telecom||[]).find(t => t.system===sys);
  return c ? c.value : "";
}
function specialty(r){
  if (r.__type==="Organization") {
    const t = (r.type||[])[0];
    return t && (t.text || (t.coding&&t.coding[0]&&t.coding[0].display)) || "";
  }
  const q = (r.qualification||[])[0];
  return q && q.code && (q.code.text || (q.code.coding&&q.code.coding[0]&&q.code.coding[0].display)) || "";
}
function copyBtn(val){
  return `<button class="copy" onclick="event.stopPropagation();navigator.clipboard.writeText('${String(val).replace(/'/g,"")}');this.textContent='✓'">Copy</button>`;
}
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])); }
</script>
</body>
</html>
