<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaineCare Provider Lookup</title>
<style>
  :root {
    --brand: #0b5fa5;
    --brand-dark: #084576;
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1a202c;
    --muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: var(--brand);
    color: #fff;
    padding: 24px 20px;
    text-align: center;
  }
  header h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0; opacity: 0.9; font-size: 0.95rem; }
  .container { max-width: 1000px; margin: 0 auto; padding: 24px 20px; }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    align-items: center;
  }
  .controls input {
    flex: 1;
    min-width: 220px;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
  }
  .controls button {
    padding: 11px 22px;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .controls button:hover { background: var(--brand-dark); }
  .controls button:disabled { opacity: 0.6; cursor: not-allowed; }
  .status { margin-bottom: 16px; color: var(--muted); font-size: 0.9rem; }
  .grid { display: grid; gap: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .card h3 { margin: 0 0 6px; font-size: 1.1rem; color: var(--brand-dark); }
  .card .meta { font-size: 0.9rem; color: var(--muted); }
  .badge {
    display: inline-block;
    font-size: 0.75rem;
    padding: 2px 9px;
    border-radius: 20px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .badge.active { background: #dcfce7; color: #166534; }
  .badge.inactive { background: #fee2e2; color: #991b1b; }
  .error {
    background: #fee2e2;
    border: 1px solid #fca5a5;
    color: #991b1b;
    padding: 14px 16px;
    border-radius: 8px;
  }
  footer { text-align: center; padding: 24px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <h1>MaineCare Provider Lookup</h1>
  <p>Search enrolled providers from the Maine Provider Directory (FHIR)</p>
</header>

<div class="container">
  <div class="controls">
    <input id="searchBox" type="text" placeholder="Filter by provider name or city…" />
    <button id="loadBtn">Load Providers</button>
  </div>
  <div class="status" id="status">Click “Load Providers” to begin.</div>
  <div class="grid" id="results"></div>
</div>

<footer>
  Data via Maine Provider Directory FHIR endpoint · Proxied through Cloudflare Worker
</footer>

<script>
  // ---- CONFIG -------------------------------------------------------------
  // Your Cloudflare Worker proxy base (no trailing slash).
  // The Worker forwards everything after this to the real FHIR server.
  const PROXY_BASE = "https://shiny-king-551f.weathered-math-22d4.workers.dev";
  const PAGE_SIZE = 50;
  // -------------------------------------------------------------------------

  let allProviders = [];

  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");
  const loadBtn = document.getElementById("loadBtn");
  const searchBox = document.getElementById("searchBox");

  async function loadProviders() {
    loadBtn.disabled = true;
    statusEl.textContent = "Loading providers…";
    resultsEl.innerHTML = "";
    allProviders = [];

    // Follow FHIR pagination via the bundle's "next" link
    let nextUrl = `${PROXY_BASE}/Organization?_count=${PAGE_SIZE}`;

    try {
      while (nextUrl) {
        const res = await fetch(nextUrl, {
          headers: { "Accept": "application/fhir+json" }
        });
        if (!res.ok) {
          throw new Error(`FHIR server returned ${res.status} ${res.statusText}`);
        }
        const bundle = await res.json();

        (bundle.entry || []).forEach(e => {
          const r = e.resource || {};
          allProviders.push({
            id: r.id || "",
            name: r.name || "(Unnamed provider)",
            active: r.active !== false,
            city: (r.address && r.address[0] && r.address[0].city) || "",
            state: (r.address && r.address[0] && r.address[0].state) || "",
            npi: extractNpi(r.identifier)
          });
        });

        // Find the "next" page link, rewrite it to go through the proxy
        const nextLink = (bundle.link || []).find(l => l.relation === "next");
        if (nextLink && nextLink.url) {
          nextUrl = rewriteThroughProxy(nextLink.url);
        } else {
          nextUrl = null;
        }
        statusEl.textContent = `Loaded ${allProviders.length} providers…`;
      }

      render(allProviders);
      statusEl.textContent = `Done. ${allProviders.length} providers loaded.`;
    } catch (err) {
      resultsEl.innerHTML =
        `<div class="error"><strong>Error loading data:</strong> ${err.message}</div>`;
      statusEl.textContent = "Load failed.";
    } finally {
      loadBtn.disabled = false;
    }
  }

  // Pull the NPI from the identifier array if present
  function extractNpi(identifiers) {
    if (!Array.isArray(identifiers)) return "";
    const npi = identifiers.find(i =>
      (i.system && i.system.toLowerCase().includes("npi")) ||
      (i.type && i.type.text && i.type.text.toLowerCase().includes("npi"))
    );
    return npi ? npi.value : "";
  }

  // The "next" link points at the real FHIR host; send it through our proxy instead
  function rewriteThroughProxy(fullUrl) {
    try {
      const u = new URL(fullUrl);
      return `${PROXY_BASE}${u.pathname}${u.search}`;
    } catch {
      return null;
    }
  }

  function render(list) {
    if (!list.length) {
      resultsEl.innerHTML = `<div class="status">No providers match your filter.</div>`;
      return;
    }
    resultsEl.innerHTML = list.map(p => `
      <div class="card">
        <h3>${escapeHtml(p.name)}
          <span class="badge ${p.active ? "active" : "inactive"}">
            ${p.active ? "Active" : "Inactive"}
          </span>
        </h3>
        <div class="meta">
          ${p.city ? escapeHtml(p.city) : "—"}${p.state ? ", " + escapeHtml(p.state) : ""}
          ${p.npi ? " · NPI: " + escapeHtml(p.npi) : ""}
          ${p.id ? " · ID: " + escapeHtml(p.id) : ""}
        </div>
      </div>
    `).join("");
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Live client-side filtering
  searchBox.addEventListener("input", () => {
    const q = searchBox.value.trim().toLowerCase();
    if (!q) { render(allProviders); return; }
    render(allProviders.filter(p =>
      p.name.toLowerCase().includes(q) ||
      p.city.toLowerCase().includes(q)
    ));
  });

  loadBtn.addEventListener("click", loadProviders);
</script>
</body>
</html>
